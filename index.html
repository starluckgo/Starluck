<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARLUCK HK</title>
<style>
/* 頂部優惠橫幅 黑底白字 */
.top-banner{
  background:#222;
  color:#ffffff;
  text-align:center;
  padding:10px;
  font-size:14px;
}

/* 漢堡選單導航 */
.nav-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
}
.logo{
  font-size:22px;
  font-weight:600;
}
.hamburger{
  font-size:28px;
  cursor:pointer;
}

/* 側欄選單，預設收埋 */
.sidebar-menu{
  position:fixed;
  top:0;
  right:-260px;
  width:240px;
  height:100vh;
  background:#ffffff;
  padding:40px 20px;
  transition: 0.3s;
  z-index:999;
}
.sidebar-menu.open{
  right:0;
}
.sidebar-menu a{
  display:block;
  padding:12px 0;
  text-decoration:none;
  color:#222;
  font-size:18px;
}
.close-btn{
  font-size:26px;
  cursor:pointer;
  position:absolute;
  top:15px;
  right:20px;
}

/* 產品陳列區 */
.collection-section{
  padding:40px;
  max-width:1200px;
  margin:0 auto;
}
.collection-title{
  text-align:center;
  margin-bottom:30px;
}
.product-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
  gap:30px;
}
.product-card{
  cursor:pointer;
}
.product-img-box{
  aspect-ratio:1/1;
  overflow:hidden;
  background:#f7f7f7;
}
.product-img-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.product-name{
  margin-top:10px;
  font-size:16px;
}
.product-price{
  margin-top:4px;
  opacity:0.7;
}
</style>
</head>
<body>
<!-- 頂部優惠橫幅 -->
<div class="top-banner">
買滿三件貨品 即免香港順豐站/櫃/中心自取運費（個別貨品除外）
</div>

<!-- 導航列 -->
<div class="nav-bar">
  <div class="logo">STARLUCK HK</div>
  <div class="hamburger" onclick="openMenu()">☰</div>
</div>

<!-- 側欄分類選單 -->
<div class="sidebar-menu" id="sideMenu">
  <div class="close-btn" onclick="closeMenu()">✕</div>
  <a href="index.html">Home 主頁</a>
  <a href="bracelets.html">Bracelets 手鏈</a>
  <a href="necklaces.html">Necklaces 頸鏈</a>
  <a href="rings.html">Rings 戒指</a>
  <a href="earrings.html">Earrings 耳環</a>
</div>

<script>
function openMenu(){
  document.getElementById("sideMenu").classList.add("open");
}
function closeMenu(){
  document.getElementById("sideMenu").classList.remove("open");
}
</script>

<!-- 主頁：最新上架 New Arrivals -->
<section class="collection-section">
  <h2 class="collection-title">New Arrivals 最新上架</h2>
  <div class="product-grid">
    <a href="product1.html" style="text-decoration:none; color:inherit;">
      <div class="product-card">
        <div class="product-img-box">
          <img src="product1.jpg" alt="Ocean Cross Bead Bracelet">
        </div>
        <div class="product-name">Ocean Cross Bead Bracelet</div>
        <div class="product-price">HK$128</div>
      </div>
    </a>
  </div>
</section>

</body>
</html>
